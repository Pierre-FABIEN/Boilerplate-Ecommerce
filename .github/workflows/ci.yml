name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    env:
      # `svelte-check` importe des modules `$env/static/private` et
      # `$env/static/public` (voir src/lib/lucia/encryption.ts, oauth.ts,
      # src/routes/api/address-search, src/routes/admin/blog/post/**).
      # SvelteKit ne génère les types de ces modules que pour les variables
      # présentes au moment de `svelte-kit sync` : sans elles, le type-check
      # échoue avec "Module has no exported member 'X'" même si le code est
      # correct. Valeurs factices, jamais utilisées au runtime dans ce job.
      ENCRYPTION_KEY: us+RPM5EHBb2Fvk3k6Az8N5d0cYu4dGaWbIUlVS8AKM=
      ENCRYPTION_KEY_LEGACY: us+RPM5EHBb2Fvk3k6Az8N5d0cYu4dGaW
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      VITE_GOOGLE_REDIRECT_URI: http://localhost:2001/auth/login/google/callback
      SECRET_ADDRESS_SEARCH_MODE: e2e
      PUBLIC_TINYMCE_API_KEY: ci
      STRIPE_SECRET_KEY: sk_test_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (prettier)
        run: npm run lint:prettier

      - name: Lint (eslint)
        # Bloquant sur les erreurs (svelte/require-each-key,
        # svelte/prefer-svelte-reactivity, svelte/prefer-writable-derived :
        # bugs de réactivité potentiels). Le reste de la dette ESLint
        # pré-existante (no-explicit-any, no-at-html-tags...) est en 'warn'
        # dans eslint.config.js — visible ici mais ne bloque pas ce step.
        run: npm run lint:eslint

      - name: Type-check (svelte-check)
        run: npm run check

      - name: Lint (knip)
        # Non-bloquant : les dépendances inutilisées ont été triées (voir
        # AUDIT_TECHNIQUE.md §3.4), reste 8 fichiers candidats à vérifier
        # individuellement avant suppression — pas de quoi bloquer le build.
        run: npm run lint:knip
        continue-on-error: true

      - name: Unit tests
        # `--coverage` : chiffre de référence (voir AUDIT_TECHNIQUE.md), pas
        # de seuil configuré (`vite.config.ts`) donc ce step reste bloquant
        # uniquement sur des tests rouges, jamais sur la couverture elle-même.
        run: npm run test:unit:coverage

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Base Postgres jetable du job (pas Neon) : aucun secret de dépôt requis.
      DATABASE_URL: postgresql://e2e:e2e@localhost:5432/e2e
      DIRECT_URL: postgresql://e2e:e2e@localhost:5432/e2e
      # Clé de test dédiée à cette base éphémère, jamais utilisée en dehors de la CI.
      ENCRYPTION_KEY: us+RPM5EHBb2Fvk3k6Az8N5d0cYu4dGaWbIUlVS8AKM=
      PUBLIC_ENV: test
      SECRET_NAME_DATA_COOKIE: test-cookie-name
      CRON_SECRET: e2e-cron-secret
      ACCOUNTING_EXPORT_EMAIL: e2e-comptabilite@example.test
      DISPUTE_ALERT_EMAIL: e2e-litiges@example.test
      # Puits SMTP local démarré par `e2e/support/global-setup.ts` : aucun email ne sort réellement.
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 2525
      SMTP_HTTP_PORT: 2526
      SMTP_USER: e2e
      SMTP_PASS: e2e
      # Valeurs factices : les intégrations externes (Google, Stripe, Sendcloud,
      # Cloudinary...) détectent ces placeholders et s'exécutent en mode mock
      # (voir `.env.test.example`). Les specs réellement live vivent sous
      # `e2e/live/` et sont exclues ci-dessous.
      VITE_GOOGLE_REDIRECT_URI: http://localhost:2001/auth/login/google/callback
      GOOGLE_CLIENT_ID: e2e-google-client-id
      GOOGLE_CLIENT_SECRET: e2e-google-client-secret
      STRIPE_SECRET_KEY: sk_test_e2e
      STRIPE_WEBHOOK_SECRET: whsec_e2e
      VITE_STRIPE_PUBLISHABLE_KEY: pk_test_e2e
      SENDCLOUD_BASE_URL: https://panel.sendcloud.sc
      SENDCLOUD_PUBLIC_KEY: e2e
      SENDCLOUD_SECRET_KEY: e2e
      SENDCLOUD_INTEGRATION_ID: '0'
      SENDCLOUD_SENDER_ADDRESS_ID: e2e
      SENDCLOUD_WEBHOOK_SECRET: e2e-sendcloud-webhook-secret
      VITE_SHOP_FROM_COUNTRY: FR
      VITE_SHOP_FROM_POSTAL: '31000'
      CLOUDINARY_CLOUD_NAME: e2e
      CLOUDINARY_API_KEY: e2e
      CLOUDINARY_API_SECRET: e2e
      PUBLIC_TINYMCE_API_KEY: e2e
      SECRET_ADDRESS_SEARCH_MODE: e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests (hors specs live)
        # `e2e/live/**` appelle de vrais services externes (Brevo, Cloudinary,
        # Sendcloud) et exige de vrais identifiants — hors périmètre CI.
        # Non-bloquant : première exécution en CI, à rendre bloquant une fois
        # la stabilité confirmée sur quelques runs.
        run: >-
          npx playwright test
          e2e/admin e2e/auth e2e/blog e2e/commerce e2e/contact
          e2e/gift-cards e2e/products e2e/promo
        continue-on-error: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
